<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>TopData</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="pop-header">
    <div class="brand">
      <span class="logo-badge" aria-hidden="true">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 7h12M12 7v11"></path>
          <path d="M8 18h8" opacity=".65"></path>
        </svg>
      </span>
      <div class="brand-copy">
        <span class="pop-title">TopData</span>
        <span class="pop-subtitle">网页采集工作流</span>
      </div>
    </div>
    <div class="header-actions">
      <button id="pickBtn" class="icon-btn" title="在当前页面可视化选择元素" aria-label="在当前页面可视化选择元素">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
        </svg>
      </button>
      <button id="newBtn" class="btn btn-primary" title="新建工作流并在编辑器中打开">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
        <span>新建</span>
      </button>
    </div>
  </header>

  <main class="pop-content">
    <div class="list-heading">
      <span class="list-title">我的工作流</span>
      <span class="list-hint">按最近更新排序</span>
    </div>
    <div id="popMsg" class="pop-msg hidden" role="alert"></div>
    <div id="wfList" class="wf-list"></div>
    <div id="wfEmpty" class="empty hidden">
      <div class="empty-icon" aria-hidden="true">
        <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="18" rx="4"></rect>
          <path d="M8 8h8M8 12h5M16.5 15.5v5M14 18h5"></path>
        </svg>
      </div>
      <strong class="empty-title">还没有工作流</strong>
      <p>点击右上角「新建」<br>创建你的第一个采集任务</p>
    </div>
  </main>

  <footer class="pop-footer">
    <a href="#" id="openHome">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="2"></rect>
        <rect x="14" y="3" width="7" height="7" rx="2"></rect>
        <rect x="3" y="14" width="7" height="7" rx="2"></rect>
        <rect x="14" y="14" width="7" height="7" rx="2"></rect>
      </svg>
      <span class="footer-label">管理全部工作流</span>
      <svg class="footer-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M14 7l5 5-5 5"></path>
      </svg>
    </a>
  </footer>

  <!-- Extension.js 兼容层：browser-polyfill 统一 Chrome/Edge/Firefox API -->
  <script src="../common/browser-polyfill.js"></script>
  <script src="../common/store.js"></script>
  <script src="../common/inspector.js"></script>
  <script src="popup.js"></script>
</body>
</html>
